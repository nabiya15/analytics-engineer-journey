<svg viewBox="0 0 460 188" xmlns="http://www.w3.org/2000/svg" width="460" height="188">

  <!-- Card background -->
  <rect width="460" height="188" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Coloured header strip -->
  <rect width="460" height="34" fill="#6D28D9" rx="12"/>
  <rect y="22" width="460" height="12" fill="#6D28D9"/>

  <!-- JOIN type label -->
  <text x="18" y="22" font-size="12" fill="#FFFFFF" font-family="system-ui,-apple-system,sans-serif" font-weight="700" letter-spacing="0.4">RIGHT JOIN</text>

  <!-- Usage badge -->
  <rect x="340" y="9" width="102" height="18" fill="rgba(255,255,255,0.18)" rx="9"/>
  <text x="391" y="21" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600">rarely written</text>

  <!-- Table name labels -->
  <text x="152" y="52" font-size="9.5" fill="#64748B" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500">autosys_jobs</text>
  <text x="308" y="52" font-size="9.5" fill="#4C1D95" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600">servicenow_tickets</text>

  <!-- Left circle (gray — left-only stays gray) -->
  <circle cx="180" cy="103" r="70" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Right circle (purple — all right rows returned) drawn on top -->
  <circle cx="280" cy="103" r="70" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="2"/>

  <!-- Re-draw borders -->
  <circle cx="180" cy="103" r="70" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <circle cx="280" cy="103" r="70" fill="none" stroke="#A78BFA" stroke-width="2"/>

  <!-- Left-only label -->
  <text x="130" y="99" font-size="9" fill="#94A3B8" text-anchor="middle" font-family="system-ui,sans-serif">NULL</text>
  <text x="130" y="113" font-size="9" fill="#CBD5E1" text-anchor="middle" font-family="system-ui,sans-serif">if no match</text>

  <!-- Intersection label -->
  <text x="230" y="99" font-size="10" fill="#5B21B6" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700">match</text>
  <text x="230" y="113" font-size="9" fill="#7C3AED" text-anchor="middle" font-family="system-ui,sans-serif">zone</text>

  <!-- Right-only label -->
  <text x="328" y="99" font-size="9" fill="#4C1D95" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600">✓ all rows</text>
  <text x="328" y="113" font-size="9" fill="#6D28D9" text-anchor="middle" font-family="system-ui,sans-serif">returned</text>

  <!-- Caption -->
  <line x1="20" y1="168" x2="440" y2="168" stroke="#F1F5F9" stroke-width="1"/>
  <text x="230" y="181" font-size="9" fill="#94A3B8" text-anchor="middle" font-family="system-ui,sans-serif">All right rows returned · rewrite as LEFT JOIN by swapping table order</text>
</svg>
