<svg viewBox="0 0 460 188" xmlns="http://www.w3.org/2000/svg" width="460" height="188">

  <!-- Card background -->
  <rect width="460" height="188" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Coloured header strip -->
  <rect width="460" height="34" fill="#047857" rx="12"/>
  <rect y="22" width="460" height="12" fill="#047857"/>

  <!-- JOIN type label -->
  <text x="18" y="22" font-size="12" fill="#FFFFFF" font-family="system-ui,-apple-system,sans-serif" font-weight="700" letter-spacing="0.4">LEFT JOIN</text>

  <!-- Usage badge -->
  <rect x="340" y="9" width="102" height="18" fill="rgba(255,255,255,0.18)" rx="9"/>
  <text x="391" y="21" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600">most common</text>

  <!-- Table name labels -->
  <text x="152" y="52" font-size="9.5" fill="#064E3B" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600">autosys_jobs</text>
  <text x="308" y="52" font-size="9.5" fill="#64748B" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500">servicenow_tickets</text>

  <!-- Right circle (gray — right-only stays gray) -->
  <circle cx="280" cy="103" r="70" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Left circle (green — all left rows returned) drawn on top -->
  <circle cx="180" cy="103" r="70" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2"/>

  <!-- Intersection overdraw (darker green — match zone) -->
  <!-- Achieved naturally: left circle (green) covers the intersection area -->

  <!-- Re-draw borders -->
  <circle cx="180" cy="103" r="70" fill="none" stroke="#34D399" stroke-width="2"/>
  <circle cx="280" cy="103" r="70" fill="none" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Left-only label (all rows returned) -->
  <text x="130" y="99" font-size="9" fill="#065F46" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600">✓ all rows</text>
  <text x="130" y="113" font-size="9" fill="#059669" text-anchor="middle" font-family="system-ui,sans-serif">returned</text>

  <!-- Intersection label -->
  <text x="230" y="99" font-size="10" fill="#065F46" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700">match</text>
  <text x="230" y="113" font-size="9" fill="#047857" text-anchor="middle" font-family="system-ui,sans-serif">zone</text>

  <!-- Right-only label (NULL where no match) -->
  <text x="328" y="99" font-size="9" fill="#94A3B8" text-anchor="middle" font-family="system-ui,sans-serif">NULL</text>
  <text x="328" y="113" font-size="9" fill="#CBD5E1" text-anchor="middle" font-family="system-ui,sans-serif">if no match</text>

  <!-- Caption -->
  <line x1="20" y1="168" x2="440" y2="168" stroke="#F1F5F9" stroke-width="1"/>
  <text x="230" y="181" font-size="9" fill="#94A3B8" text-anchor="middle" font-family="system-ui,sans-serif">All left rows returned · right side fills in where matched · NULL where it does not</text>
</svg>
