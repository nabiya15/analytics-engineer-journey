<svg viewBox="0 0 460 188" xmlns="http://www.w3.org/2000/svg" width="460" height="188">
  <defs>
    <clipPath id="inner-right-clip">
      <circle cx="280" cy="103" r="70"/>
    </clipPath>
  </defs>

  <!-- Card background -->
  <rect width="460" height="188" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Coloured header strip -->
  <rect width="460" height="34" fill="#1D4ED8" rx="12"/>
  <rect y="22" width="460" height="12" fill="#1D4ED8"/>

  <!-- JOIN type label -->
  <text x="18" y="22" font-size="12" fill="#FFFFFF" font-family="system-ui,-apple-system,sans-serif" font-weight="700" letter-spacing="0.4">INNER JOIN</text>

  <!-- Row-count badge -->
  <rect x="368" y="9" width="74" height="18" fill="rgba(255,255,255,0.18)" rx="9"/>
  <text x="405" y="21" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600">5 rows</text>

  <!-- Table name labels -->
  <text x="152" y="52" font-size="9.5" fill="#64748B" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500">autosys_jobs</text>
  <text x="308" y="52" font-size="9.5" fill="#64748B" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500">servicenow_tickets</text>

  <!-- Base circles (both gray — nothing selected yet) -->
  <circle cx="180" cy="103" r="70" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <circle cx="280" cy="103" r="70" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>

  <!-- Intersection highlight (blue) — left circle clipped to right circle boundary -->
  <circle cx="180" cy="103" r="70" fill="#2563EB" clip-path="url(#inner-right-clip)"/>

  <!-- Re-draw circle borders on top so lines are clean -->
  <circle cx="180" cy="103" r="70" fill="none" stroke="#93C5FD" stroke-width="2"/>
  <circle cx="280" cy="103" r="70" fill="none" stroke="#93C5FD" stroke-width="2"/>

  <!-- Left-only label (excluded) -->
  <text x="130" y="99" font-size="9" fill="#94A3B8" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500">JOB005</text>
  <text x="130" y="113" font-size="9" fill="#CBD5E1" text-anchor="middle" font-family="system-ui,sans-serif">✗  excluded</text>

  <!-- Intersection label (returned) -->
  <text x="230" y="99" font-size="10" fill="#FFFFFF" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700">match</text>
  <text x="230" y="113" font-size="9" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-family="system-ui,sans-serif">only</text>

  <!-- Caption -->
  <line x1="20" y1="168" x2="440" y2="168" stroke="#F1F5F9" stroke-width="1"/>
  <text x="230" y="181" font-size="9" fill="#94A3B8" text-anchor="middle" font-family="system-ui,sans-serif">Only rows that exist in both tables are returned · no match = dropped</text>
</svg>
